topic: "Однопроходная генерация цельного изображения через промпт «Каркас 5+3», цикл VLM-доводки и финальный фильтр стиля."
thought_process: >
  Сначала жёсткая проверка стартовых ворот безопасности (NSFW, Copyright, Person, Violence),
  затем конструирование точного моноязычного промпта базового кадра без маскирующей стилизации,
  цикл генерации и VLM-осмотра до приёмки или Iteration Limit с немедленным удалением неудачных
  попыток, сохранение проверенного base-final и наложение целевого фильтра стиля только в самом конце.

