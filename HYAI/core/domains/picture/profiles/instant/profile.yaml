workflow: "picture/instant"
definition_of_done:
  - "Все 4 правила безопасности (NSFW, Copyright, Person, Violence) явно заданы пользователем до старта (PIC-SAF-01)."
  - "Каждое изображение создано строго через моноязычный промпт каркаса «5+3» с динамическим negative и корректными весами (PIC-POL-01..02, PIC-PRM-01..05)."
  - "Проверенный базовый кадр base-final сохранён в pictures/stages/, а все неудачные дубли удалены (PIC-POL-04)."
  - "Фильтр стиля наложен строго после готовности base-final; финальный кадр прошёл VLM-проверку артефактов и порогов качества (PIC-POL-05, PIC-QA-01..05)."
checklist:
  - "Задал ли пользователь явно все четыре параметра NSFW, Copyright, Person и Violence?"
  - "Соответствует ли промпт каркасу «5+3», порогу MinDetail, языку модели и её синтаксису весов?"
  - "Удалены ли все отбракованные попытки и сохранён ли принятый base-final перед стилевым фильтром?"
  - "Проверены ли VLM руки, лица, текст, пропорции и разрешение на финальном изображении?"

