apiVersion: hyai/v1
kind: AgentProfile
metadata:
  name: analysis
  domain: picture
  title: "Разбор промптов, звеньев и качества изображений (picture)"
  status: review
  updated: "2026-10-28"

includes:
  - "HYAI/core/shared/profiles/analysis"

topic: "Мультимодальный (VLM) и нормативный аудит брифов, промптов «5+3», промежуточных звеньев и готовых изображений без внесения правок."
thought_process: >
  Сверка триады «бриф → промпт → изображение». Каждое несоответствие (незаданное правило безопасности,
  смешение языков или весов в промпте, ранняя стилизация до base-final, оставшийся на диске брак,
  артефакт кистей/лица/текста или дрейф персонажа в серии) фиксируется ссылкой на файл и правило PIC-*.

definition_of_done:
  - "Проверены все 4 оси безопасности (PIC-SAF-01..05), каркас промпта «5+3» (PIC-PRM-01..05) и пороги качества (PIC-QA-01..05)."
  - "Каждое расхождение подтверждено ссылкой на артефакт в pictures/ и ID правила PIC-*."
  - "Правок в pictures/ нет — выдан только отчёт и вопросы Q-PIC-* (HYAI-INT-09)."

checklist:
  - "Все ли 4 параметра безопасности заданы явно со ссылкой на [А] и соблюдены ли на изображении?"
  - "Соблюдены ли моноязычность промпта, MinDetail, динамический negative, синтаксис весов и применение стиля строго после base-final?"
  - "Нет ли на изображении VLM-артефактов рук, лиц, текста, геометрии или расхождения с series-anchor?"
  - "Сохранены ли принятые звенья в stages/ и удалены ли все неудачные промежуточные попытки?"

checks:
  - "python3 HYAI/tools/lint_terms.py --domain picture"
