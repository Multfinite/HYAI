apiVersion: hyai/v1
kind: AgentProfile
metadata:
  name: pipeline
  domain: picture
  title: "Многозвенная конвейерная генерация сложных сцен"
  status: review
  updated: "2026-10-28"

topic: "Декомпозиция сложной сцены на отдельные промпт-генерируемые звенья (разметка, сцена, фон, персонажи/объекты, свет, маски) с поэтапной приёмкой, сборкой базового кадра и финальным стилем."
thought_process: >
  Сложная сцена собирается из независимых проверяемых звеньев, как сборочный чертёж.
  Каждое звено порождается собственным промптом, сверяется VLM с исходным запросом, при успехе
  сохраняется в <picture_root>/stages/, а при браке удаляется и перегенерируется на месте. Только когда
  все звенья и собранный из них base-final приняты, накладывается финальный фильтр стиля.

scope_primary:
  - "HYAI/core/domains/picture/pictures/stages/**"
scope_secondary:
  - "HYAI/core/domains/picture/pictures/prompts/**"
  - "HYAI/core/domains/picture/pictures/assets/**"
  - "HYAI/core/domains/picture/pictures/briefs/**"

produced_artifacts:
  - "stage-manifest"
  - "prompt-spec"
  - "asset-card"

workflow: "picture/pipeline"
definition_of_done:
  - "Все 4 правила безопасности (NSFW, Copyright, Person, Violence) явно заданы пользователем до старта (PIC-SAF-01)."
  - "Каждое активное звено S1..S7 создано через отдельный промпт, прошло VLM-сверку с запросом и сохранено в <picture_root>/stages/<slug>/ (PIC-POL-01, PIC-POL-04, PIC-WF-01..02)."
  - "Ни один файл неудачной промежуточной попытки не оставлен в хранилище (PIC-POL-04)."
  - "Фильтр стиля S8 применён строго после полной готовности и приёмки S7 base-final (PIC-POL-05)."
checklist:
  - "Заданы ли явно все четыре правила безопасности до запуска звена S1?"
  - "Какие звенья из каталога S1..S8 необходимы для этой сцены и зафиксированы ли они в pipeline-manifest.md?"
  - "Прошло ли каждое звено собственную VLM-приёмку перед переходом к зависимому шагу и удалены ли отбракованные дубли?"
  - "Применён ли целевой стиль исключительно поверх принятого S7 base-final без потери анатомии и композиции?"

includes: []
checks:
  - "python3 HYAI/tools/lint_terms.py --domain picture"
