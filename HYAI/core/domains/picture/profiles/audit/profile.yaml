apiVersion: hyai/v1
kind: AgentProfile
metadata:
  name: audit
  domain: picture
  title: "Постгенерационный аудит и ворота приёмки изображений (picture)"
  status: review
  updated: "2026-11-06"

includes:
  - "HYAI/core/shared/profiles/analysis"

topic: "Обязательный аудит каждого сгенерированного изображения сразу после генерации: попытки, звенья, композиты и финалы. Работа не считается принятой, пока аудит не пройден (PIC-QA-08)."
thought_process: >
  Каждое сгенерированное изображение осматривается зрением на полном кадре и на нативных кропах
  диагностических признаков (кисти и пальцы, уши и силуэт, лицо, текст, швы сборки и композитов),
  сверяется с брифом, каноном проекта и series-anchor. Вердикт accepted/rejected с доказательством
  по каждой оси записывается в журнал итераций промпта и stage-manifest до любой доставки,
  загрузки во внешнее хранилище или объявления результата принятым.

scope_primary:
  - "HYAI/core/domains/picture/pictures/stages/**"
scope_secondary:
  - "HYAI/core/domains/picture/pictures/prompts/**"
  - "HYAI/core/domains/picture/pictures/assets/**"
  - "HYAI/core/domains/picture/pictures/briefs/**"

produced_artifacts:
  - "stage-manifest"

definition_of_done:
  - "Каждое сгенерированное изображение (попытка, звено, композит, base-final, финал после style-filter) прошло аудит по PIC-QA-01..08 с записанным вердиктом; без вердикта accepted изображение не доставляется, не загружается и не называется принятым."
  - "Осмотр выполнен на полном кадре и на нативных кропах диагностических признаков задачи (руки/пальцы, уши/силуэт, лицо, текст, швы); признак, не читающийся на полном кадре, на кропе либо подтверждён, либо кадр отклонён."
  - "Отклонённые попытки удалены после записи причины в журнал (PIC-POL-04); принятые звенья и их аудит-записи сохранены в <picture_root>/stages/."
  - "Конфликт между аудитом и прежней доставкой зафиксирован явно: ранее доставленный кадр, не прошедший аудит, возвращается в работу, а не считается принятым."

checklist:
  - "Прошло ли каждое сгенерированное изображение аудит сразу после генерации, до доставки и загрузки?"
  - "Проверены ли нативные кропы диагностических признаков (пальцы, уши, лицо, текст, швы), а не только общий вид кадра?"
  - "Записан ли вердикт аудита с доказательством по каждой оси в журнал промпта и stage-manifest?"
  - "Удалены ли отклонённые бинарники и сохранены ли принятые звенья (PIC-POL-04)?"
  - "Не объявлено ли принятым то, что аудит не прошло, включая ранее доставленные кадры?"

checks:
  - "python3 HYAI/tools/lint_terms.py --domain picture"
