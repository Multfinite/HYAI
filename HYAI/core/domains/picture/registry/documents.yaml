version: "1.0"
domain: picture
read_first:
  - "HYAI/meta/project.md"
  - "HYAI/core/domains/picture/policy.md"
  - "HYAI/core/domains/picture/authority.md"
  - "HYAI/core/domains/picture/access.md"
documents:
  - id: picture.policy
    path: "HYAI/core/domains/picture/policy.md"
    type: policy
    authority: contract
    why: "Обязательные правила промпт-генерации, стартовых ворот безопасности, промптов «5+3», конвейеров и VLM-качества"
  - id: picture.authority
    path: "HYAI/core/domains/picture/authority.md"
    type: policy
    authority: invariant
    why: "Уровни visual-canon, brief, prompt, stage и границы полномочий владельца"
  - id: picture.access
    path: "HYAI/core/domains/picture/access.md"
    type: policy
    authority: invariant
    why: "Контуры public/internal/restricted, правила выгрузки и обязательного disclaimer"
  - id: picture.architecture
    path: "HYAI/meta/architecture/picture.md"
    type: architecture
    authority: contract
    why: "Раскладка рабочего корня <picture_root>/, изоляция подмодуля и инварианты хранения"
  - id: picture.terminology
    path: "HYAI/meta/terminology/picture.md"
    type: meta
    authority: contract
    why: "Словарь терминов домена: Каркас 5+3, base-neutral, base-final, style-filter, series-anchor"
  - id: picture.workflow.handoff-page
    path: "HYAI/core/domains/picture/workflows/handoff-page.md"
    type: workflow
    authority: contract
    why: "Процесс picture/handoff-page: страница переноса «промпт + картинка» в другой чат (PIC-POL-10..11, PIC-WF-03, PIC-QA-07)"
  - id: picture.template.handoff-page
    path: "HYAI/core/domains/picture/templates/handoff-page.md"
    type: template
    authority: none
    why: "Поля манифеста, обязательная структура страницы, запреты и приёмка формы переноса"
  - id: picture.template.handoff-page-html
    path: "HYAI/core/domains/picture/templates/handoff-page.html"
    type: template
    authority: none
    why: "Каркас автономной HTML-страницы: карточки, data: URI, кнопки копирования и фолбэки"
  - id: picture.workflow.remediation
    path: "HYAI/core/domains/picture/workflows/remediation.md"
    type: workflow
    authority: contract
    why: "Практики ремедиации и повторной ревизии: эталон картинкой, пересадка детали, участковая генерация, руки на крупном предмете, ухо под прядью (PIC-QA-09)"
  - id: registry.workflow.instant
    path: "HYAI/core/domains/picture/workflows/instant.md"
    type: workflow
    authority: contract
    why: "Процесс picture/instant: однопроходная генерация с циклом VLM-доводки и финальным стилем"
  - id: registry.workflow.pipeline
    path: "HYAI/core/domains/picture/workflows/pipeline.md"
    type: workflow
    authority: contract
    why: "Процесс picture/pipeline: многозвенный конвейер сцены с поэтапной VLM-приёмкой и финальным стилем"
  - id: registry.workflow.series
    path: "HYAI/core/domains/picture/workflows/series.md"
    type: workflow
    authority: contract
    why: "Процесс picture/series: генерация серии изображений с сохранением стиля и персонажа"
  - id: registry.workflow.style-filter
    path: "HYAI/core/domains/picture/workflows/style-filter.md"
    type: workflow
    authority: contract
    why: "Процесс picture/style-filter: наложение фильтра стиля на готовое базовое изображение"
  - id: registry.template.prompt-spec
    path: "HYAI/core/domains/picture/templates/prompt-spec.md"
    type: template
    authority: none
    why: "Шаблон спецификации промпта по каноническому каркасу «5+3»"
  - id: registry.template.pipeline-manifest
    path: "HYAI/core/domains/picture/templates/pipeline-manifest.md"
    type: template
    authority: none
    why: "Шаблон карты промежуточных звеньев конвейера picture/pipeline"
  - id: registry.template.series-anchor
    path: "HYAI/core/domains/picture/templates/series-anchor.md"
    type: template
    authority: none
    why: "Шаблон эталона консистентности серии и отложенного фильтра стиля"
  - id: registry.template.asset-card
    path: "HYAI/core/domains/picture/templates/asset-card.md"
    type: template
    authority: none
    why: "Шаблон паспорта готового изображения и протокола VLM-приёмки"

  - id: picture.workflow.cepi
    path: "HYAI/core/domains/picture/workflows/crop-edit-paste-integrate.md"
    type: workflow
    authority: contract
    why: "Обязательный CEPI для локальных генеративных исправлений, границы гарантий и остановки"
  - id: picture.template.cepi-manifest
    path: "HYAI/core/domains/picture/templates/cepi-manifest.md"
    type: template
    authority: none
    why: "Проверяемая запись состояния, артефактов и доставки CEPI"
  - id: picture.template.cepi-prompts
    path: "HYAI/core/domains/picture/templates/cepi-prompts.md"
    type: template
    authority: none
    why: "Раздельные промпты исправления, сильного стиля и сведения"
