topic: "Разбор неясной задачи в коде: что происходит на самом деле, какие варианты есть, что рекомендуем."
thought_process: >
  Разбор кода начинается с воспроизведения, а не с чтения. Сначала факт: как ведёт себя система.
  Потом гипотеза: почему. Потом цена каждого варианта правки — включая цену «не трогать».

definition_of_done:
  - "Поведение системы описано воспроизводимым способом или признано невоспроизводимым."
  - "У каждого варианта названа цена и то, что он ломает."
  - "Неясности вынесены в Q-* и в HYAI/meta/questions/software.md."

checklist:
  - "Я воспроизвёл поведение или предположил его?"
  - "Какой вариант дешевле всего проверить первым?"
  - "Что сломается у потребителей контракта?"

