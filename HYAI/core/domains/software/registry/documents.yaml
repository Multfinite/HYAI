# Документы, которые агент читает первыми при работе в домене software.
version: "2.0"
domain: software
read_first:
  - "HYAI/meta/project.md"
  - "HYAI/meta/architecture/software.md"
  - "HYAI/core/domains/software/policy.md"
  - "HYAI/meta/terminology/software.md"
documents:
  - id: sw.arch
    path: "HYAI/meta/architecture/software.md"
    type: architecture
    authority: contract
    why: "границы, инварианты и анти-паттерны домена"
  - id: sw.policy
    path: "HYAI/core/domains/software/policy.md"
    type: policy
    authority: contract
    why: "правила SW-POL-01..13"
  - id: sw.access
    path: "HYAI/core/domains/software/access.md"
    type: meta
    authority: invariant
    why: "контуры доступа к коду и документации"
  - id: registry.workflow.bugfix
    path: "HYAI/core/domains/software/workflows/bugfix.md"
    type: workflow
    authority: contract
    why: "Процесс software/bugfix: воспроизведение и исправление"
  - id: registry.workflow.feature
    path: "HYAI/core/domains/software/workflows/feature.md"
    type: workflow
    authority: contract
    why: "Процесс software/feature: новая возможность"
  - id: registry.workflow.refactor
    path: "HYAI/core/domains/software/workflows/refactor.md"
    type: workflow
    authority: contract
    why: "Процесс software/refactor: изменение устройства без изменения поведения"
  - id: registry.template.module-card
    path: "HYAI/core/domains/software/templates/module-card.md"
    type: template
    authority: none
    why: "Шаблон модульной карточки: цена и отказы"
  - id: registry.template.spec
    path: "HYAI/core/domains/software/templates/spec.md"
    type: template
    authority: none
    why: "Шаблон спецификации модуля или возможности"
