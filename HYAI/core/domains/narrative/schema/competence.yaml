# Каталог доменов компетенции домена narrative. Читается resolve_access.py.
#
# Домен компетенции — категория знания, а не тема документа. Уровень хранится числом 0–14,
# отображается как `Уn`; `УН` — отсутствие домена в профиле. Значения уровней — levels.md.
#
# `levels` — необязательный словарь «рейтинг → граница понимания»: он задаёт формулировку
# «знает до …» в карте понимания. Если формулировок нет, движок пишет нейтрально
# «знает до У4 включительно» и это считается долгом проекта, а не нормой.
version: "1.0"
domain: narrative
source: "HYAI/core/domains/narrative/levels.md"

domains:
  - id: medicine            # пример формы: домен знания, а не тема документа
    title: "Медицина"
    aliases: ["Медицина", "медицина", "медтех"]
    levels:
      1: "симптомов"
      4: "первой помощи, без методик"
      6: "диагностики и курса лечения"
      10: "клинических исследований"
      14: "создания методик"

  - id: politics
    title: "Политика"
    aliases: ["Политика", "политика"]

  - id: history
    title: "История"
    aliases: ["История", "история"]

# Каталог проекта. Записи ниже — примеры формы, а не содержание: при внедрении
# они заменяются доменами знания своего мира. Пустой каталог законен: движок
# тогда пишет нейтральное «знает до Уn включительно» и это считается долгом проекта.
#
# Служебные домены — те, которые не задаёт автор, а использует система; список пуст,
# пока проект не объявил свои. Формат:
# reserved:
#   - id: <код>
#     title: "<название>"
#     note: "<чем отличается от авторских доменов>"
reserved: []
