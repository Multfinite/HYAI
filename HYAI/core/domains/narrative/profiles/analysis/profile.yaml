topic: "Противоречия, пробелы и провисания в корпусе: где мир не сходится и что с этим делать."
thought_process: >
  Разбор корпуса — это перекрёстные проверки. Каждое противоречие подтверждается двумя местами,
  каждый пробел превращается в вопрос владельцу, а не в придуманный факт.

definition_of_done:
  - "Каждое противоречие подтверждено двумя местами в корпусе."
  - "У каждого пробела есть Q-* с формулировкой вопроса."
  - "Правок в корпусе нет (HYAI-INT-09)."

checklist:
  - "Где два факта не могут быть верны одновременно?"
  - "Чего не хватает, чтобы сцена работала?"
  - "Кто в мире должен был бы это знать — и знает ли?"

checks:
  - "python3 HYAI/tools/lint_scopes.py --domain narrative"
