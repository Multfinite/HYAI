version: "1.1"
domain: cartography
# Три части: read_first + documents — обязательное чтение; records + toolkit — раскладка данных атласа.
read_first:
  - "HYAI/core/domains/cartography/README.md"
  - "HYAI/core/domains/cartography/policy.md"
  - "HYAI/meta/decisions/project/P-0005-cartography-world-canon.md"
documents:
  - id: cartography.policy
    path: "HYAI/core/domains/cartography/policy.md"
    type: policy
    authority: contract
    why: "Правила домена cartography"
  - id: cartography.authority
    path: "HYAI/core/domains/cartography/authority.md"
    type: meta
    authority: invariant
    why: "Домен cartography: уровни авторитетности"
  - id: cartography.access
    path: "HYAI/core/domains/cartography/access.md"
    type: policy
    authority: invariant
    why: "Домен cartography: доступ и хранение атласов"
  - id: cartography.architecture
    path: "HYAI/meta/architecture/cartography.md"
    type: architecture
    authority: contract
    why: "Архитектура домена cartography"
  - id: cartography.workflow.intake
    path: "HYAI/core/domains/cartography/workflows/intake.md"
    type: workflow
    authority: contract
    why: "Intake планетарного атласа"
  - id: cartography.workflow.body-model
    path: "HYAI/core/domains/cartography/workflows/body-model.md"
    type: workflow
    authority: contract
    why: "Модель звёздной системы и тела"
  - id: cartography.workflow.layer-model
    path: "HYAI/core/domains/cartography/workflows/layer-model.md"
    type: workflow
    authority: contract
    why: "Создание тематического векторного слоя"
  - id: cartography.workflow.map-production
    path: "HYAI/core/domains/cartography/workflows/map-production.md"
    type: workflow
    authority: contract
    why: "Векторная карта и интерактивный просмотр"
  - id: cartography.workflow.audit
    path: "HYAI/core/domains/cartography/workflows/audit.md"
    type: workflow
    authority: contract
    why: "Аудит атласа и картографической выдачи"
records:
  systems:
    path: "<atlas_root>/systems/"
    template: "HYAI/core/domains/cartography/templates/system-record.yaml"
    owns: "Идентификаторы звёздных систем, звёзд, орбитальные параметры и календарные периоды."
  bodies:
    path: "<atlas_root>/bodies/"
    template: "HYAI/core/domains/cartography/templates/body-record.yaml"
    owns: "Размеры, фигура, датум/CRS, ось, вращение и ссылка на родительскую систему."
  layers:
    path: "<atlas_root>/layers/"
    templates:
      - "HYAI/core/domains/cartography/templates/geospatial-layer.yaml"
      - "HYAI/core/domains/cartography/templates/climate-layer.yaml"
    owns: "Векторные тематические слои; производные значения содержат модель и provenance."
  maps:
    path: "<atlas_root>/maps/"
    template: "HYAI/core/domains/cartography/templates/map-spec.yaml"
    owns: "Проекция, стиль, легенда, vector output и sidecar-метаданные."
  exports:
    path: "<atlas_root>/exports/"
    owns: "Только согласованные векторные deliverables и записи QA; экранный viewport не экспортируется как raster."
toolkit:
  vector_gis: "QGIS — кандидат на редактирование геоданных и SVG export; пользовательские planetary CRS требуют проверки."
  vector_editor: "Inkscape — редактор SVG."
  interactive_view: "CesiumJS — кандидат на просмотр векторных слоёв на интерактивном 3D-глобусе; это только renderer, не научная модель."
  validation: "Прототип на целевом теле проверяет эллипсоид, CRS, единицы, ось, временные данные и точность SVG/векторных слоёв."
