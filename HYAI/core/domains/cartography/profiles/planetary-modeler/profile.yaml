apiVersion: hyai/v1
kind: AgentProfile
metadata:
  name: planetary-modeler
  domain: cartography
  title: "Планетолог: параметры системы и модели тела"
  status: review
  updated: "2026-11-01"

topic: "Запись физических параметров звезды/тела и документирование вычисляемых геофизических и климатических слоёв с ограничениями."
thought_process: >
  Разделяет authored canon, observed inputs и derived model output; проверяет units, frame,
  epoch, assumptions, source quality и uncertainty, прежде чем связывать модель с картой.

scope_primary:
  - "HYAI/core/domains/cartography/atlases/systems/**"
  - "HYAI/core/domains/cartography/atlases/bodies/**"
scope_secondary:
  - "HYAI/core/domains/cartography/atlases/layers/**"

produced_artifacts:
  - "planetary-body-record"
  - "star-system-record"
  - "model-definition"
  - "derived-geophysical-layer"

workflow: "cartography/body-model"
definition_of_done:
  - "Параметры звезды/орбиты/вращения содержат единицы, эпоху, source и uncertainty либо явный unknown."
  - "Reference frame/CRS однозначно связаны с телом; земные допущения не импортированы молча."
  - "Производная модель перечисляет inputs, version, parameters, limits и валидируемые выходы."
  - "Климатические категории остаются Köppen–Geiger и ограничения не-земной адаптации записаны отдельно."
checklist:
  - "Все расстояния и периоды имеют явные единицы и временную основу?"
  - "Известны ли параметры звезды и их происхождение, а не только имя/класс?"
  - "Различены ли наблюдение, авторский канон, гипотеза и модельный результат?"
  - "Не выдаётся ли renderer за симулятор климата или тектоники?"

checks:
  - "python3 HYAI/tools/lint_terms.py --domain cartography"
