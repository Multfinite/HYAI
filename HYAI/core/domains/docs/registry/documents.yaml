version: "1.0"
domain: docs
read_first:
  - "HYAI/meta/project.md"
  - "HYAI/meta/architecture/docs.md"
  - "HYAI/core/domains/docs/policy.md"
documents:
  - id: doc.text
    path: "HYAI/core/domains/docs/text.md"
    type: policy
    authority: contract
    why: "правила чистки документов: требование, читатель, вода"
  - id: doc.policy
    path: "HYAI/core/domains/docs/policy.md"
    type: policy
    authority: contract
    why: "правила DOC-POL-01..14"
  - id: doc.authority
    path: "HYAI/core/domains/docs/authority.md"
    type: meta
    authority: invariant
    why: "чем normative отличается от descriptive"
  - id: doc.templates
    path: "HYAI/core/domains/docs/templates/README.md"
    type: meta
    authority: none
    why: "какая форма у ТЗ, спецификации, руководства и схемы"
  - id: registry.workflow.spec
    path: "HYAI/core/domains/docs/workflows/spec.md"
    type: workflow
    authority: contract
    why: "Процесс docs/spec: ТЗ и техническая спецификация"
  - id: registry.workflow.documentation
    path: "HYAI/core/domains/docs/workflows/documentation.md"
    type: workflow
    authority: contract
    why: "Процесс docs/documentation: документация и комментарии"
  - id: registry.workflow.diagrams
    path: "HYAI/core/domains/docs/workflows/diagrams.md"
    type: workflow
    authority: contract
    why: "Процесс docs/diagrams: схемы и диаграммы"
