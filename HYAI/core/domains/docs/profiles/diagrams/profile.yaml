topic: "Диаграммы и схемы: UML, C4, потоки данных, состояния, последовательности."
thought_process: >
  От вопроса к минимальной схеме. Сначала «что должно стать понятно», потом тип диаграммы,
  только потом узлы. Лишняя сущность на схеме — такой же шум, как лишний абзац в тексте.
  Схема строится по источнику (код, документ), а не по памяти.

