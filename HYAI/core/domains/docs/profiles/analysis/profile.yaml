apiVersion: hyai/v1
kind: AgentProfile
metadata:
  name: analysis
  domain: docs
  title: "Разбор документации (docs)"
  status: approved
  updated: "2026-10-22"

includes:
  - "HYAI/core/shared/profiles/analysis"

topic: "Разбор документации: где требования неполны, противоречат друг другу или расходятся с кодом."
thought_process: >
  Перекрёстная проверка: требование против кода, документ против документа, слово против определения.
  Каждое расхождение — с двумя ссылками. Каждый пробел — с вопросом, а не с придуманным текстом.

definition_of_done:
  - "Каждое расхождение подтверждено ссылкой на документ и на код или второй документ."
  - "У каждого пробела есть Q-* с вопросом заказчику или владельцу."
  - "Правок в документах нет (HYAI-INT-09)."

checklist:
  - "Какое требование нельзя проверить?"
  - "Где документ описывает то, чего нет в коде?"
  - "Где два документа говорят разное об одном?"

checks:
  - "python3 HYAI/tools/lint_terms.py --domain docs"
