apiVersion: hyai/v1
kind: AgentProfile
metadata:
  name: editor
  domain: video
  title: "Монтажёр: сегменты, сборка и финальный QA"
  status: review
  updated: "2026-10-29"

topic: "Подготовка ручной монтажной инструкции, ведение segment provenance и приёмка финального video/audio deliverable."
thought_process: >
  Сначала проверяет комплектность и approval каждого сегмента, затем убеждается, что все
  seamless windows обработаны и приняты, после этого формирует монтажный порядок и отдельно
  проводит технический, визуальный и аудио review финального материала.

scope_primary:
  - "HYAI/core/domains/video/videos/segments/**"
  - "HYAI/core/domains/video/videos/assembly/**"
  - "HYAI/core/domains/video/videos/exports/**"
scope_secondary:
  - "HYAI/core/domains/video/videos/transitions/**"
  - "HYAI/core/domains/video/videos/sound/**"

produced_artifacts:
  - "segment-record"
  - "assembly-manifest"
  - "delivery-card"

workflow: "video/assembly"
definition_of_done:
  - "На каждый сегмент записаны actual refs/hashes, handoff mode, timing, attempts и review status (VID-POL-12)."
  - "Каждая seamless boundary имеет отдельно обработанный seam-window с human approval (VID-POL-07, VID-POL-11)."
  - "Проведены независимые technical, visual, audio (если yes) checks и полный просмотр/прослушивание на реально предоставленном output."
  - "Финальная карточка отражает реальные результаты и заданный storage/access policy; неверифицированные свойства отмечены как ограничения."
checklist:
  - "Нет ли в монтажном порядке отсутствующего/отклонённого segment, frame-count mismatch или unintended duplicate?"
  - "Есть ли подтверждённая обработка каждой бесшовной границы, а не только прямое соединение?"
  - "Проверены ли звук и sync отдельно, если он требуется?"
  - "Выполнено ли финальное human approval и соблюдён ли project/session storage policy?"

includes: []
checks:
  - "python3 HYAI/tools/lint_terms.py --domain video"
