version: "1.0"
domain: video
model: flat
visibility:
  values: [public, internal, restricted]
  default: internal
  order: [restricted, internal, public]
status_order: [draft, review, approved, superseded, deprecated, archived]
rules:
  default_deny: true
  inherit_strictest: true
  strip_fields: [internal_notes, storage_location]
checks:
  - id: acc.unknown_visibility
    severity: error
    kind: unknown_visibility
export:
  presets:
    public:
      allow_visibility: [public]
      status_floor: approved
      strip_frontmatter: true
      strip_internal_links: true
      strip_markers: true
      strip_internal_ids: true
      strip_comments: true
      strip_repo_paths: true
      out_dir: "Exports/video-public"
