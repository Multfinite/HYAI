# Оверлей домена cartography: планетарные атласы, векторные слои и карты.
version: "1.0"
domain: cartography
extends: "HYAI/meta/schema/frontmatter.yaml"

enums:
  authority: [atlas-canon, source-record, derived-layer, map-design, export-record, none]
  visibility: [public, internal, restricted]
  status: [draft, review, approved, superseded, deprecated, archived]
  type:
    - meta
    - policy
    - workflow
    - template
    - report
    - decision
    - atlas-record
    - planet-system
    - planet-body
    - geospatial-layer
    - climate-layer
    - tectonic-layer
    - current-layer
    - political-layer
    - map-spec
    - export-record
    - working

forbidden_values:
  authority: [invariant, implementation, convention, normative, descriptive, illustrative, informative, core, setting, detail, presentation]
  visibility: [spoiler, author, system]

defaults_by_dir:
  "HYAI/core/domains/cartography/atlases": {type: atlas-record, authority: source-record, visibility: internal}
