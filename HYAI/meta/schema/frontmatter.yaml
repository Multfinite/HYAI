# Базовая схема frontmatter (уровень ядра). Читается HYAI/tools/frontmatter.py.
# Доменные оверлеи — в HYAI/meta/schema/domains/. Словари authority/status — в HYAI/core/domains/<d>/schema/.
version: "2.0"

required: [id, title, type, status, authority, visibility]

# Необязательные поля, которые схема не отвергает: домены добавляют свои через overlay.
optional:
  - domain
  - profile
  - cross_scope
  - cross_scope_field
  - decisions
  - template
  - template_kind
  - date
  - scope
  - affects
  - affects_domains
  - supersedes
  - superseded_by
  - merged_into
  - knowledge
  - known_by
  - requires
  - role
  - prism
  - characters
  - owner
  - version
  - updated
  - enforced
  - generated
  - report_kind
  - workflow

enums:
  type:
    - meta
    - policy
    - workflow
    - template
    - report
    - decision
    - spec
    - architecture
    - contract
    - runbook
    - reference
    - entity
    - article
    - narrative
    - rules
    - tool
    - working
  status: [draft, review, approved, superseded, deprecated, archived, merged]
  authority: [invariant, contract, convention, none]
  visibility: [public, internal, restricted]
  template_kind: [output, request, snippet]
  report_kind: [task, audit, analysis]

# Поля-флаги, которых в каркасе быть не может: флаг — это решение, которое агент принимает, а не читает.
# Читают frontmatter.py и check_domains.py.
forbidden_fields:
  - self_editable
  - may_edit_domains
  - activation
  - assumed
  - auto_activate
  - allow_self_edit

field_aliases: {}

skip_parts:
  - .git
  - __pycache__
  - node_modules
  - .venv
  - venv
  - dist
  - build
  - _backups
  - .obsidian
  - Exports

skip_prefixes:
  - HYAI/core/intermediate

# Файлы, которые не являются самостоятельными документами (фрагменты сборки).
skip_names:
  - agents.md

# Значения по умолчанию для новых .md: ключ — префикс пути от корня репозитория.
defaults_by_dir:
  src: {type: reference, authority: contract, visibility: internal}
  tests: {type: reference, authority: contract, visibility: internal}
  docs: {type: spec, authority: contract, visibility: public}
  world: {type: entity, authority: contract, visibility: internal}
  chapters: {type: narrative, authority: convention, visibility: internal}
  HYAI/core: {type: reference, authority: invariant, visibility: internal}
  HYAI/tools: {type: tool, authority: none, visibility: internal}
  HYAI/meta: {type: meta, authority: contract, visibility: internal}

root_default:
  type: working
  authority: none
  visibility: internal

# Правила слияния доменного оверлея с базой (MERGE-01..06)
merge:
  required: union
  optional: union
  enums: replace_by_key
  defaults_by_dir: override
  skip_parts: union
  skip_prefixes: union
  field_aliases: union
